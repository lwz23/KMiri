<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .t { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .h { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .k { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .b { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 14px; fill: #1f2937; }
      .s { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 13px; fill: #374151; }
      .m { font-family: Consolas, monospace; font-size: 13px; fill: #1f2937; }
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="46" class="t">图 7 中断什么时候来：注入时机的三层方案（现状）</text>
  <text x="40" y="74" class="s">每一层回答一个独立的问题。第 1、2 层决定“可能性准不准”（不漏、不误报），第 3 层决定“找不找得到”。</text>

  <!-- Layer 1 -->
  <rect x="40" y="92" width="1320" height="200" rx="12" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="122" class="h">第 1 层：会来什么中断（事件源）</text>
  <rect x="60" y="138" width="300" height="140" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text class="b"><tspan x="76" y="164" class="k">时钟中断 ✔</tspan><tspan x="76" dy="24">内核设置了时钟（armed）才产生；</tspan><tspan x="76" dy="22">按虚拟时间（块计数）周期到期。</tspan><tspan x="76" dy="22">内核调度、定时器、bottom half</tspan><tspan x="76" dy="22">都依赖它</tspan></text>
  <rect x="375" y="138" width="300" height="140" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text class="b"><tspan x="391" y="164" class="k">测试显式触发 ✔</tspan><tspan x="391" dy="24">kern_miri_test_raise_irq(vector)：</tspan><tspan x="391" dy="22">在代码里某一点确定地触发，</tspan><tspan x="391" dy="22">用于 KMiri 自身的单元测试</tspan><tspan x="391" dy="22">（如图 8）</tspan></text>
  <rect x="690" y="138" width="340" height="140" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text class="b"><tspan x="706" y="164" class="k">“对抗性外设” ✔（默认关闭）</tspan><tspan x="706" dy="24">任意已注册向量、任意合法时刻。</tspan><tspan x="706" dy="22">依据：book 把外设列为不可信，可以</tspan><tspan x="706" dy="22">“generate arbitrary interrupts”。不仿真</tspan><tspan x="706" dy="22">设备，只把它当作一个不确定的输入</tspan></text>
  <rect x="1045" y="138" width="300" height="140" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="b"><tspan x="1061" y="164" class="k">第一版不做</tspan><tspan x="1061" dy="24">IPI（多核）、NMI/MCE（不受 IF</tspan><tspan x="1061" dy="22">控制）、同步异常 #PF/#GP（由指令</tspan><tspan x="1061" dy="22">触发）、电平触发与设备寄存器</tspan><tspan x="1061" dy="22">仿真</tspan></text>

  <line x1="700" y1="292" x2="700" y2="316" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="716" y="310" class="s">raise 之后先进 pending（每个向量锁存 1 位）</text>

  <!-- Layer 2 -->
  <rect x="40" y="322" width="1320" height="170" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="352" class="h">第 2 层：什么时候“可以”送（合法性，保证不误报）✔ 已实现</text>
  <rect x="60" y="368" width="520" height="110" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="b"><tspan x="76" y="394" class="k">候选点 = 每个 MIR 基本块的边界</tspan><tspan x="76" dy="24">先例：QEMU TCG 在翻译块（TB）边界检查中断，</tspan><tspan x="76" dy="22">遇到可能开中断的指令就退出 TB 重新检查；</tspan><tspan x="76" dy="22">Miri 本身也在每个 terminator 后决定是否抢占线程</tspan></text>
  <rect x="596" y="368" width="370" height="110" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="b"><tspan x="612" y="394" class="k">必须同时满足</tspan><tspan x="612" dy="24">① 正在执行内核态代码&#160;&#160;② IF = 1</tspan><tspan x="612" dy="22">③ 优先级类高于所有 in-service 向量</tspan><tspan x="612" dy="22">④ 嵌套深度未到上限（到了就报诊断）</tspan></text>
  <rect x="982" y="368" width="363" height="110" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="b"><tspan x="998" y="394" class="k">两个推论</tspan><tspan x="998" dy="24">• 关中断期间来的中断被锁存，IF 一打开，</tspan><tspan x="998" dy="22">&#160;&#160;下一个块边界立刻送达（与 x86 一致）</tspan><tspan x="998" dy="22">• 不在块内部注入：只会漏报，不会误报</tspan></text>

  <line x1="700" y1="492" x2="700" y2="516" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="716" y="510" class="s">合法点非常多：一次星绽集成运行就有数百万个块边界</text>

  <!-- Layer 3 -->
  <rect x="40" y="522" width="1320" height="250" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="552" class="h">第 3 层：在合法点里“真的”选哪些（探索策略，决定找不找得到）</text>
  <g>
    <rect x="60" y="568" width="205" height="190" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
    <text class="b"><tspan x="74" y="594" class="k">周期 ✔ 正在用</tspan><tspan x="74" dy="24">每 N 块产生一次 tick</tspan><tspan x="74" dy="22">（集成测试 N=10000）。</tspan><tspan x="74" dy="22">作用：模拟“时钟在走”，</tspan><tspan x="74" dy="22">做基线和冒烟测试。</tspan><tspan x="74" dy="22">只覆盖合法点的极小</tspan><tspan x="74" dy="22">一部分</tspan></text>
    <rect x="277" y="568" width="205" height="190" rx="10" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
    <text class="b"><tspan x="291" y="594" class="k">指定块号 ◐</tspan><tspan x="291" dy="24">inject_at_basic_blocks</tspan><tspan x="291" dy="22">开关已有、尚未使用。</tspan><tspan x="291" dy="22">执行是确定的，所以</tspan><tspan x="291" dy="22">块号能唯一标识一个点：</tspan><tspan x="291" dy="22">它是“逐点穷举”和</tspan><tspan x="291" dy="22">“重放”的基础</tspan></text>
    <rect x="494" y="568" width="205" height="190" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
    <text class="b"><tspan x="508" y="594" class="k">随机 + 种子 ✔</tspan><tspan x="508" dy="24">每个合法点按种子决定</tspan><tspan x="508" dy="22">的概率注入，向量取自</tspan><tspan x="508" dy="22">配置的集合（不只时钟）。</tspan><tspan x="508" dy="22">同一种子跑两次，trace</tspan><tspan x="508" dy="22">逐字节相同。报告“K 个</tspan><tspan x="508" dy="22">种子里检出几次”</tspan></text>
    <rect x="711" y="568" width="205" height="190" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
    <text class="b"><tspan x="725" y="594" class="k">关键点注入 ✔</tspan><tspan x="725" dy="24">IF 刚由 0 变 1 时按概率</tspan><tspan x="725" dy="22">注入。guard 释放、锁释放、</tspan><tspan x="725" dy="22">bottom half 开中断都属于</tspan><tspan x="725" dy="22">这一类，已被覆盖。</tspan><tspan x="725" dy="22">锁和 per-CPU 访问前后</tspan><tspan x="725" dy="22">暂不做</tspan></text>
    <rect x="928" y="568" width="205" height="190" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text class="b"><tspan x="942" y="594" class="k">有界穷举 ✘</tspan><tspan x="942" dy="24">对一组候选点逐个</tspan><tspan x="942" dy="22">“只注入这一次”重跑</tspan><tspan x="942" dy="22">（k=1，必要时 k=2）。</tspan><tspan x="942" dy="22">小测试上可以给出</tspan><tspan x="942" dy="22">“此范围内无 bug”</tspan></text>
    <rect x="1145" y="568" width="200" height="190" rx="10" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
    <text class="b"><tspan x="1159" y="594" class="k">重放 ◐</tspan><tspan x="1159" dy="24">同一种子重跑即可复现；</tspan><tspan x="1159" dy="22">trace 记录每个事件</tspan><tspan x="1159" dy="22">的 raised / accepted /</tspan><tspan x="1159" dy="22">eoi / returned 和块号；</tspan><tspan x="1159" dy="22">还不能从 trace 直接</tspan><tspan x="1159" dy="22">生成注入计划</tspan></text>
  </g>

  <rect x="40" y="790" width="1320" height="76" rx="10" fill="#eef4ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="b"><tspan x="58" y="816" class="k" style="fill:#1e3a8a">现状：第 1 层有时钟、测试触发、对抗性外设三种事件源；第 3 层有周期、随机、关键点三种策略。</tspan>
    <tspan x="58" dy="26">随机和关键点注入默认关闭，关闭时已有测试的 trace 逐字节不变。尚未实现：有界穷举、从 trace 生成注入计划。</tspan></text>

  <rect x="40" y="878" width="16" height="12" rx="3" fill="#e7f6ec" stroke="#16a34a"/><text x="62" y="889" class="s">绿 = 已实现并在用</text>
  <rect x="200" y="878" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#1d4ed8"/><text x="222" y="889" class="s">蓝 ◐ = 机制已有、尚未使用或尚不完整</text>
  <rect x="470" y="878" width="16" height="12" rx="3" fill="#fff7ed" stroke="#f59e0b"/><text x="492" y="889" class="s">橙 ✘ = 尚未实现</text>
  <rect x="640" y="878" width="16" height="12" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="662" y="889" class="s">灰虚线 = 第一版不做</text>
</svg>
