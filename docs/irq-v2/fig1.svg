<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#374151"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "SimHei", sans-serif; fill: #1f2937; }
      .en { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #374151; }
      .title { font-size: 24px; font-weight: 700; }
      .header { font-size: 18px; font-weight: 700; }
      .body { font-size: 15.5px; }
      .small { font-size: 14px; }
      .bold { font-weight: 700; }
      .gray { fill: #4b5563; }
    </style>
  </defs>

  <text x="30" y="42" class="cn title">图 1  星绽的 soundness 定义下，中断会带来哪些 UB，KMiri 要建模什么</text>

  <text x="178" y="92" text-anchor="middle" class="cn header">中断对内核做了什么</text>
  <text x="522" y="92" text-anchor="middle" class="cn header">可能导致的 UB</text>
  <text x="881" y="92" text-anchor="middle" class="cn header">需要的语义</text>
  <text x="1221" y="92" text-anchor="middle" class="cn header">KMiri 的部件</text>
  <line x1="330" y1="86" x2="348" y2="86" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="694" y1="86" x2="712" y2="86" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1048" y1="86" x2="1066" y2="86" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <g stroke-width="2">
    <rect x="28" y="112" width="300" height="96" rx="10" fill="#f3e8ff" stroke="#7c3aed"/>
    <rect x="28" y="222" width="300" height="96" rx="10" fill="#f3e8ff" stroke="#7c3aed"/>
    <rect x="28" y="332" width="300" height="96" rx="10" fill="#f3e8ff" stroke="#7c3aed"/>
    <rect x="352" y="112" width="340" height="96" rx="10" fill="#fde8e8" stroke="#dc2626"/>
    <rect x="352" y="222" width="340" height="96" rx="10" fill="#fde8e8" stroke="#dc2626"/>
    <rect x="352" y="332" width="340" height="96" rx="10" fill="#fde8e8" stroke="#dc2626"/>
    <rect x="716" y="112" width="330" height="96" rx="10" fill="#e8f0fe" stroke="#1d4ed8"/>
    <rect x="716" y="222" width="330" height="96" rx="10" fill="#e8f0fe" stroke="#1d4ed8"/>
    <rect x="716" y="332" width="330" height="96" rx="10" fill="#e8f0fe" stroke="#1d4ed8"/>
    <rect x="1070" y="112" width="302" height="96" rx="10" fill="#e7f6ec" stroke="#16a34a"/>
    <rect x="1070" y="222" width="302" height="96" rx="10" fill="#e7f6ec" stroke="#16a34a"/>
    <rect x="1070" y="332" width="302" height="96" rx="10" fill="#e7f6ec" stroke="#16a34a"/>
  </g>

  <!-- row 1 -->
  <text class="cn body"><tspan x="44" y="146">① 异步重入：handler 在任意</tspan><tspan x="44" dy="24">IF=1 的点打断同一 CPU 上的代码</tspan></text>
  <text class="cn body"><tspan x="368" y="138">别名违规 / UAF：handler 与被打断</tspan><tspan x="368" dy="24">代码同时访问 OSTD 内部状态</tspan><tspan x="368" dy="24">（CPU-local、IRQ 回调表等）</tspan></text>
  <text class="cn body"><tspan x="732" y="146">所有合法点都可能注入；</tspan><tspan x="732" dy="24">handler 在被打断的执行流上执行</tspan></text>
  <text class="cn body"><tspan x="1086" y="166">① 中断产生器 + ④ 跳转与返回</tspan></text>

  <!-- row 2 -->
  <text class="cn body"><tspan x="44" y="248">② 原子模式状态与真实中断</tspan><tspan x="44" dy="24">状态不一致</tspan><tspan x="44" dy="24">（guard 乱序释放等）</tspan></text>
  <text class="cn body"><tspan x="368" y="256">RCU 宽限期提前结束 → UAF</tspan><tspan x="368" dy="24">（#3896）</tspan></text>
  <text class="cn body"><tspan x="732" y="256">IF 与 guard 状态真实；</tspan><tspan x="732" dy="24">yield → OSTD 真实切换路径</tspan></text>
  <text class="cn body"><tspan x="1086" y="276">③ 投递判断（IF 真实）</tspan></text>

  <!-- row 3 -->
  <text class="cn body"><tspan x="44" y="366">③ 嵌套重入：bottom half</tspan><tspan x="44" dy="24">开中断后再次被打断</tspan></text>
  <text class="cn body"><tspan x="368" y="366">同 ①，发生在中断上下文内部</tspan><tspan x="368" dy="24">（per-CPU、中断级别状态）</tspan></text>
  <text class="cn body"><tspan x="732" y="366">EOI 与 iret 分离；</tspan><tspan x="732" dy="24">x86 优先级类决定能否嵌套</tspan></text>
  <text class="cn body"><tspan x="1086" y="386">② 中断登记表 + ③ 投递判断</tspan></text>

  <!-- not our concern -->
  <rect x="28" y="452" width="830" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="cn body bold"><tspan x="48" y="482">不关心：不是 UB</tspan></text>
  <text class="en small"><tspan x="48" y="508">book：“The OS may crash, deadlock, or behave incorrectly — but it will never silently corrupt memory.”</tspan></text>
  <text class="cn body gray"><tspan x="48" y="542">死锁、自死锁 · 原子模式中睡眠（OSTD 会 panic，这正是它的防线）</tspan><tspan x="48" dy="28">丢失唤醒、空闲卡死 · 漏发 EOI · 调度饿死</tspan></text>

  <!-- UB but out of reach -->
  <rect x="878" y="452" width="494" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="cn body bold"><tspan x="898" y="482">是 UB，但第一版覆盖不到</tspan></text>
  <text class="cn body gray"><tspan x="898" y="514">trap 汇编里的寄存器保存 / 恢复</tspan><tspan x="898" dy="27">swapgs 与用户态切换窗口</tspan><tspan x="898" dy="27">嵌套中断栈溢出 · 跨核（只做单核）</tspan></text>

  <!-- principle -->
  <rect x="28" y="626" width="1344" height="82" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text class="cn body"><tspan x="50" y="658">目标 = 星绽的 soundness 定义：kernel/ 中任意 safe API 调用序列 + 外设在任意时刻发出的中断，都不得触发 UB。</tspan><tspan x="50" dy="26">KMiri 负责把这些中断时机正确地造出来（可能性要准，时间可以不准）；是不是 UB 由 Miri 判定。</tspan></text>

  <!-- legend -->
  <text x="30" y="770" class="cn body bold">图例：</text>
  <rect x="92" y="755" width="20" height="20" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="771" class="cn small">紫=中断效应</text>
  <rect x="235" y="755" width="20" height="20" rx="4" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="263" y="771" class="cn small">红=UB 类别</text>
  <rect x="370" y="755" width="20" height="20" rx="4" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="398" y="771" class="cn small">蓝=所需语义</text>
  <rect x="520" y="755" width="20" height="20" rx="4" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text x="548" y="771" class="cn small">绿=KMiri 部件</text>
  <rect x="680" y="755" width="20" height="20" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="708" y="771" class="cn small">灰虚线=不关心 / 覆盖不到</text>
  <rect x="900" y="755" width="20" height="20" rx="4" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="928" y="771" class="cn small">橙=目标与原则</text>
</svg>
