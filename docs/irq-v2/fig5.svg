<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="40" y="48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#111827">图 5  每个 (CPU, 向量) 的状态机与接受规则（含 x86 优先级）</text>

  <!-- 状态框 -->
  <rect x="60" y="180" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="145" y="229" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#111827">Inactive</text>

  <rect x="340" y="180" width="180" height="80" rx="10" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="430" y="229" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#111827">Pending</text>

  <rect x="650" y="180" width="180" height="80" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="229" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#111827">Active</text>

  <rect x="650" y="470" width="180" height="80" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="519" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#111827">Active + Pending</text>

  <!-- 状态转移箭头 -->
  <line x1="230" y1="220" x2="336" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="283" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">raise</text>

  <line x1="520" y1="220" x2="646" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="585" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">accept</text>
  <text x="585" y="290" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#374151">压入口帧 · saved_if · IF←0</text>

  <path d="M395 180 L395 142 L465 142 L465 176" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="430" y="132" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">再次 raise → merged</text>

  <line x1="780" y1="260" x2="780" y2="466" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="768" y="370" text-anchor="end" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">handler 期间再次 raise</text>

  <path d="M650 510 L400 510 L400 264" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="525" y="535" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827"><tspan x="525">EOI</tspan><tspan x="525" dy="21" font-size="14">（仍 pending，等待再次 accept）</tspan></text>

  <path d="M740 180 L740 90 L145 90 L145 176" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="440" y="82" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">EOI</text>

  <!-- 错误提示 -->
  <rect x="70" y="640" width="350" height="70" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="670" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#991b1b">
    <tspan x="245" dy="0">入口返回时仍 Active（漏 EOI）</tspan>
    <tspan x="245" dy="24">→ 诊断（Abort，不算发现）</tspan>
  </text>

  <rect x="450" y="640" width="350" height="70" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="625" y="670" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#991b1b">
    <tspan x="625" dy="0">对非 Active 向量 EOI</tspan>
    <tspan x="625" dy="24">→ 诊断（Abort，不算发现）</tspan>
  </text>

  <!-- 接受规则 -->
  <rect x="900" y="130" width="450" height="320" rx="10" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1125" y="164" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">接受规则（每个块边界检查）</text>

  <text x="925" y="201" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">
    <tspan x="925" dy="0">1. IF = 1</tspan>
    <tspan x="925" dy="22"></tspan>
  </text>

  <text x="925" y="254" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">2. 候选 = Pending 中优先级最高的向量 v</text>

  <text x="925" y="286" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">
    <tspan x="925" dy="0">3. 仅当 prio(v) &gt; 所有 Active 向量的 prio 时接受</tspan>
    <tspan x="925" dy="22">   x86：prio = vector &gt;&gt; 4，TPR 固定为 0</tspan>
  </text>

  <text x="925" y="341" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">4. 嵌套深度达到上限 → Abort 报诊断（不静默截断）</text>

  <!-- v1 区别 -->
  <rect x="900" y="475" width="450" height="105" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="1125" y="508" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#92400e">
    <tspan x="1125" dy="0">为什么按优先级类判断：</tspan>
    <tspan x="1125" dy="25">同类向量互相嵌套在 x86 上不可能发生</tspan>
  </text>

  <!-- 架构映射 -->
  <rect x="900" y="610" width="450" height="125" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1125" y="643" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#374151">
    <tspan x="1125" dy="0">只做 x86 LAPIC：accept 时硬件隐式 ack，</tspan>
    <tspan x="1125" dy="25">内核写 EOI 寄存器结束服务；</tspan>
    <tspan x="1125" dy="25">TPR 固定为 0（星绽从不写 TPR）；</tspan>
    <tspan x="1125" dy="25">不建模电平触发、NMI</tspan>
  </text>

  <!-- 图例 -->
  <text x="40" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#111827">图例：</text>

  <rect x="105" y="787" width="22" height="22" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="136" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">灰=空闲</text>

  <rect x="245" y="787" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="276" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">蓝=pending</text>

  <rect x="405" y="787" width="22" height="22" rx="4" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="436" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">橙=active</text>

  <rect x="560" y="787" width="22" height="22" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="591" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">紫=active+pending</text>

  <rect x="790" y="787" width="22" height="22" rx="4" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="821" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#111827">红=诊断（不算发现）</text>
</svg>