<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .t { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .h { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 17px; font-weight: 700; fill: #111827; }
      .b { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 15px; fill: #1f2937; }
      .s { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 13.5px; fill: #374151; }
      .m { font-family: Consolas, monospace; font-size: 15px; fill: #1f2937; }
      .ms { font-family: Consolas, monospace; font-size: 13px; fill: #374151; }
      .c { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 13.5px; fill: #6b7280; }
    </style>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,0 L5,9 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="40" y="48" class="t">图 8 中断 + 别名：一个只有加入中断才会出现的 UB（已检出）</text>

  <!-- code panel -->
  <rect x="40" y="78" width="560" height="420" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="106" class="h">测试代码（tests/fail/kmiri/irq-alias-mut-raise.rs）</text>
  <text class="m">
    <tspan x="62" y="146">static mut STATE: u32 = 0;</tspan>
    <tspan x="62" dy="30">fn handler() {</tspan><tspan class="c">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;// 中断处理函数</tspan>
    <tspan x="62" dy="30">&#160;&#160;&#160;&#160;*addr_of_mut!(STATE) += 1;</tspan>
    <tspan x="62" dy="30">}</tspan>
    <tspan x="62" dy="40">fn main() {</tspan>
    <tspan x="62" dy="30">&#160;&#160;&#160;&#160;let r = &amp;mut *addr_of_mut!(STATE);</tspan>
    <tspan x="62" dy="30">&#160;&#160;&#160;&#160;*r = 1;</tspan>
    <tspan x="62" dy="30">&#160;&#160;&#160;&#160;raise_irq(handler);</tspan><tspan class="c">&#160;&#160;&#160;// 中断送达</tspan>
    <tspan x="62" dy="30" style="fill:#dc2626" font-weight="700">&#160;&#160;&#160;&#160;*r = 2;</tspan><tspan class="c" style="fill:#dc2626">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;// ← Miri 在此报 UB</tspan>
    <tspan x="62" dy="30">}</tspan>
  </text>
  <rect x="56" y="438" width="528" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text class="s"><tspan x="68" y="458">异步版本 irq-alias-mut-timer：循环里不调用任何中断 API，</tspan><tspan x="68" dy="20">由时钟中断自己到来，同样报 UB（SB 与 Tree Borrows 下都报）。</tspan></text>

  <!-- timeline -->
  <text x="640" y="106" class="h">执行时间线（真实 trace 与 Miri 输出）</text>
  <line x1="660" y1="122" x2="660" y2="492" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/>

  <circle cx="660" cy="150" r="13" fill="#1d4ed8"/><text x="660" y="155" text-anchor="middle" class="s" style="fill:#fff" font-weight="700">1</text>
  <rect x="690" y="124" width="670" height="54" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="b"><tspan x="704" y="146"><tspan class="m">let r = &amp;mut STATE</tspan>：建立一个 Unique 借用，标签 &lt;357&gt;</tspan><tspan x="704" dy="22" class="s">借用栈：[ …, &lt;357&gt; Unique ]</tspan></text>

  <circle cx="660" cy="218" r="13" fill="#1d4ed8"/><text x="660" y="223" text-anchor="middle" class="s" style="fill:#fff" font-weight="700">2</text>
  <rect x="690" y="194" width="670" height="48" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="b"><tspan x="704" y="223"><tspan class="m">*r = 1</tspan>：合法，&lt;357&gt; 还在借用栈上</tspan></text>

  <circle cx="660" cy="290" r="13" fill="#7c3aed"/><text x="660" y="295" text-anchor="middle" class="s" style="fill:#fff" font-weight="700">3</text>
  <rect x="690" y="258" width="670" height="78" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="b"><tspan x="704" y="280">中断送达（IF 1→0），handler 被压在 main 的栈顶执行，</tspan><tspan x="704" dy="22">用裸指针写 STATE，&lt;357&gt; 因此被弹出借用栈</tspan></text>
  <text x="704" y="326" class="ms">KMiri IRQ: event=0 action=delivered global_block_count=369 IF=0</text>

  <circle cx="660" cy="372" r="13" fill="#7c3aed"/><text x="660" y="377" text-anchor="middle" class="s" style="fill:#fff" font-weight="700">4</text>
  <rect x="690" y="350" width="670" height="46" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="b"><tspan x="704" y="372">handler 返回，IF 恢复为 1</tspan><tspan x="900" dy="0" class="ms">action=returned block_count=371 IF=true</tspan></text>

  <circle cx="660" cy="448" r="13" fill="#dc2626"/><text x="660" y="453" text-anchor="middle" class="s" style="fill:#fff" font-weight="700">5</text>
  <rect x="690" y="412" width="670" height="80" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text class="b"><tspan x="704" y="434" font-weight="700" style="fill:#b91c1c"><tspan class="m" style="fill:#b91c1c">*r = 2</tspan>：Miri 报 Undefined Behavior</tspan></text>
  <text class="ms" style="fill:#7f1d1d"><tspan x="704" y="458">attempting a write access using &lt;357&gt; at alloc1[0x0], but that</tspan><tspan x="704" dy="18">tag does not exist in the borrow stack for this location</tspan></text>

  <!-- controls -->
  <text x="40" y="540" class="h">对照组：证明“报得出”，也证明“不误报”</text>
  <rect x="40" y="556" width="430" height="92" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
  <text class="b"><tspan x="56" y="584" font-weight="700">对照 ①：关中断保护</tspan><tspan x="56" dy="24">同样的循环包在 IrqGuard 里 → 通过；</tspan><tspan x="56" dy="22">guard 释放后 handler 确实运行过（事件没丢）</tspan></text>
  <rect x="485" y="556" width="430" height="92" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
  <text class="b"><tspan x="501" y="584" font-weight="700">对照 ②：正确写法</tspan><tspan x="501" dy="24">每次重新取裸指针、不持有长期 &amp;mut</tspan><tspan x="501" dy="22">→ 通过（正确代码不误报）</tspan></text>
  <rect x="930" y="556" width="430" height="92" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
  <text class="b"><tspan x="946" y="584" font-weight="700">对照 ③：关闭中断注入</tspan><tspan x="946" dy="24">同一程序、tick 间隔设为 0 → EXIT=0</tspan><tspan x="946" dy="22">→ UB 确实是中断带来的</tspan></text>

  <rect x="40" y="672" width="1320" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text class="b"><tspan x="60" y="702" font-weight="700">这个例子说明了什么</tspan>
    <tspan x="60" dy="26">Miri 是顺序解释器，没有“被打断”的概念。没有中断支持时第 3 步根本不存在，这段代码会被判为正确，但真实硬件上中断随时会来。</tspan>
    <tspan x="60" dy="24">KMiri 把 handler 压在被打断执行流的栈顶执行，Miri 原有的 Stacked/Tree Borrows 就能看到冲突。KMiri 没有另加任何 UB 规则。</tspan></text>

  <rect x="40" y="800" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#1d4ed8"/><text x="64" y="812" class="s">蓝 = 被打断的任务代码</text>
  <rect x="230" y="800" width="18" height="14" rx="3" fill="#f3e8ff" stroke="#7c3aed"/><text x="254" y="812" class="s">紫 = 中断（KMiri 注入）</text>
  <rect x="430" y="800" width="18" height="14" rx="3" fill="#fde8e8" stroke="#dc2626"/><text x="454" y="812" class="s">红 = Miri 报出的 UB</text>
  <rect x="610" y="800" width="18" height="14" rx="3" fill="#e7f6ec" stroke="#16a34a"/><text x="634" y="812" class="s">绿 = 对照组（均通过）</text>
</svg>
