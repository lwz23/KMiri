    <tspan x="315" dy="19" font-family="Consolas, monospace">test_raise_irq(vector)；</tspan>
    <tspan x="315" dy="19">星绽 </tspan><tspan font-family="Consolas, monospace">miri_dispatch_irq</tspan><tspan> → </tspan>
    <tspan x="315" dy="19" font-family="Consolas, monospace">trap_handler</tspan>
