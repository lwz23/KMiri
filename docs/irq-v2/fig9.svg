  <text x="25" y="474" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13.5" fill="#6b7280">
    前置 PR 合并后，把 fork 中的下一组 rebase 到上游再提交；所有改动提交前都会 rebase 到各仓库 kmiri 分支最新提交并重跑全部测试。
  </text>

  <!-- 已有的验证结果 -->
  <rect x="25" y="525" width="650" height="250" rx="10" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text x="45" y="560" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="700" fill="#166534">已有的验证结果</text>
  <text x="50" y="598" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#1f2937">
    <tspan x="50" dy="0">• 中断 + 别名：只有加入中断才出现的 UB，关闭注入后消失</tspan>
    <tspan x="50" dy="35">• 星绽真实嵌套：bottom half 开中断后被时钟再次打断（L1 → L2），23/23 个事件配对</tspan>
    <tspan x="50" dy="35">• #1648 一行重新引入的变体（不提交）：触及嵌套上限；原版嵌套不超过 2 层</tspan>
    <tspan x="50" dy="35">• 注入策略：原版 10 个种子共注入 837 次，无误报；变体 10/10 失败</tspan>
  </text>

