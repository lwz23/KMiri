<rect width="1160" height="720" fill="#fff"/>
<defs><pattern id="u" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde2e2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d04040" stroke-width="2"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<text x="580" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">图 5　4 条 UB 的来源：Dirent::from_buf_ref 与 Dirent::name()</text>
<text x="40" y="70" font-size="15" fill="#333">BlueOS 上 ino_t = u16、off_t = i32，所以 Dirent 对齐 4 字节，名字从第 14 字节开始；头部有 3 个填充字节（偏移 2、3、11）。</text>
<text x="40" y="108" font-size="17" font-weight="bold" fill="#333">① 未对齐的引用（4 条测试都先停在这里）</text>
<rect x="40" y="120" width="1080" height="70" rx="8" fill="#fafafa" stroke="#999"/>
<text x="60" y="148" font-size="14" font-family="Consolas, monospace" fill="#333">let mut buf = [0u8; 256];   // 对齐只有 1</text>
<text x="60" y="174" font-size="14" font-family="Consolas, monospace" fill="#333">let d = unsafe { Dirent::from_buf_ref(&amp;buf) };   // 造出 &amp;Dirent，要求 4 对齐</text>
<text x="700" y="148" font-size="14" fill="#b03030">KMiri：required 4 byte alignment but found 2</text>
<text x="700" y="174" font-size="13" fill="#555">缓冲区地址恰好是 4k+2；是否对齐取决于栈布局</text>
<text x="40" y="232" font-size="17" font-weight="bold" fill="#333">② 改成对齐缓冲后：name() 固定取 256 字节，越出缓冲区（test_dirent）</text>
<rect x="60" y="250" width="800" height="34" fill="#eef3fb" stroke="#2f5fa8"/>
<text x="460" y="272" text-anchor="middle" font-size="13">buf：256 字节（一个条目 "test.txt" + 后面全是 0）</text>
<rect x="103.8" y="292" width="800.0" height="22" fill="none" stroke="#b03030" stroke-width="2" stroke-dasharray="6 3"/>
<text x="109.8" y="308" font-size="13" fill="#b03030">name() 造的 &amp;[u8]：偏移 14 起 256 字节</text>
<rect x="860" y="292" width="43.8" height="22" fill="#fde2e2" stroke="#b03030"/>
<text x="864" y="340" font-size="13" fill="#b03030">多出 14 字节在缓冲区外 → dangling reference</text>
<text x="40" y="378" font-size="17" font-weight="bold" fill="#333">③ getdents 两条测试：name() 的 256 字节盖到下一个条目的未初始化填充字节</text>
