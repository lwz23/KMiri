<text x="446" y="394" font-size="13" fill="#b03030">memchr 按 8 字节一次读 32..40（含 \0），其中 38、39 未初始化 → UB</text>
<rect x="50" y="550" width="18" height="16" fill="#e6ecf5" stroke="#888"/><text x="76" y="563" font-size="13" fill="#333">头部字段（write_node 写入）</text>
<rect x="410" y="550" width="18" height="16" fill="url(#u)" stroke="#888"/><text x="436" y="563" font-size="13" fill="#333">填充字节：从栈上临时 Dirent 原样拷来，未初始化</text>
<rect x="770" y="550" width="18" height="16" fill="#d7efd3" stroke="#888"/><text x="796" y="563" font-size="13" fill="#333">名字</text>
<rect x="50" y="576" width="18" height="16" fill="#555" stroke="#888"/><text x="76" y="589" font-size="13" fill="#333">结尾 \0</text>
<rect x="410" y="576" width="18" height="16" fill="#ffffff" stroke="#888"/><text x="436" y="589" font-size="13" fill="#333">补齐到 4 字节（缓冲区原来的 0）</text>
<text x="40" y="636" font-size="14" fill="#333">"." 的名字在 14、15，memchr 对齐前逐字节扫，15 就找到 \0，所以没出错；".." 的名字跨到 32，开始按字读，读到 "dev" 头部的填充字节。</text>
<text x="40" y="662" font-size="14" fill="#333">修法：name() 只取 d_namlen + 1 字节；测试用对齐缓冲。两处都改后，原来报 UB 的 4 条测试全部通过。</text>
