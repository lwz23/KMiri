<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1160" height="640" fill="#ffffff"/>
  <text x="580" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">图 1　BlueOS 原生运行 vs 在 KMiri 中运行：哪些层原样执行，哪些层替换</text>
  <text x="290" y="72" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">原生：QEMU qemu_riscv64</text>
  <text x="870" y="72" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">KMiri：板子 board="kmiri"</text>

  <!-- row 1 tests -->
  <rect x="40" y="88" width="500" height="62" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="290" y="113" text-anchor="middle" font-size="16" fill="#1d4d1d">内核单测 kernel_unittest（#[test] 函数）</text>
  <text x="290" y="137" text-anchor="middle" font-size="14" fill="#1d4d1d">启动后由 init_test 线程逐条执行</text>
  <rect x="620" y="88" width="500" height="62" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="870" y="113" text-anchor="middle" font-size="16" fill="#1d4d1d">同一批测试，代码不变</text>
  <text x="870" y="137" text-anchor="middle" font-size="14" fill="#1d4d1d">另加：按名字只跑一条（读 semihosting 命令行）</text>

  <!-- row 2 kernel -->
  <rect x="40" y="162" width="500" height="88" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="290" y="188" text-anchor="middle" font-size="16" fill="#1d4d1d">内核组件</text>
  <text x="290" y="212" text-anchor="middle" font-size="14" fill="#1d4d1d">调度器 · 同步原语 · 线程/进程 · 定时器</text>
  <text x="290" y="234" text-anchor="middle" font-size="14" fill="#1d4d1d">VFS（tmpfs/procfs/fatfs）· 串口/时钟/IPI 驱动</text>
  <rect x="620" y="162" width="500" height="88" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="870" y="200" text-anchor="middle" font-size="16" fill="#1d4d1d">原样执行，逐条 MIR 解释并检查 UB</text>
  <text x="870" y="226" text-anchor="middle" font-size="14" fill="#1d4d1d">驱动读写的是 KMiri 的设备模型</text>

  <!-- row 3 allocator -->
  <rect x="40" y="262" width="500" height="62" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="290" y="288" text-anchor="middle" font-size="16" fill="#1d4d1d">分配器 slab_dynamic + buddy</text>
  <text x="290" y="311" text-anchor="middle" font-size="14" fill="#1d4d1d">9 个出入口：alloc/malloc/calloc/…/free/realloc</text>
  <rect x="620" y="262" width="330" height="62" rx="8" fill="#e3f4e1" stroke="#3a8a3a"/>
  <text x="785" y="288" text-anchor="middle" font-size="16" fill="#1d4d1d">同一分配器，原样运行</text>
  <text x="785" y="311" text-anchor="middle" font-size="14" fill="#1d4d1d">自己决定块放在哪</text>
  <rect x="960" y="262" width="160" height="62" rx="8" fill="#fff4cc" stroke="#b08800"/>
  <text x="1040" y="286" text-anchor="middle" font-size="14" fill="#5c4700">notify.rs 记账</text>
  <text x="1040" y="308" text-anchor="middle" font-size="13" fill="#5c4700">9 处出入口通知</text>

  <!-- row 4 arch -->
  <rect x="40" y="336" width="500" height="88" rx="8" fill="#eeeeee" stroke="#777"/>
  <text x="290" y="362" text-anchor="middle" font-size="16" fill="#333">arch/riscv（内联汇编）</text>
  <text x="290" y="386" text-anchor="middle" font-size="14" fill="#333">_start · trap_entry/mret · ecall 切换上下文</text>
  <text x="290" y="408" text-anchor="middle" font-size="14" fill="#333">csrr mhartid · csrs mstatus.MIE · wfi</text>
  <rect x="620" y="336" width="500" height="88" rx="8" fill="#dde9fb" stroke="#2f5fa8"/>
  <text x="870" y="362" text-anchor="middle" font-size="16" fill="#173a6e">arch/kmiri（新文件，483 行）</text>
  <text x="870" y="386" text-anchor="middle" font-size="14" fill="#173a6e">miri_start · irq_entry · switch_in_trap</text>
  <text x="870" y="408" text-anchor="middle" font-size="14" fill="#173a6e">每条汇编操作 → 一个 KMiri 原语（共 10 个）</text>

  <!-- row 5 board -->
  <rect x="40" y="436" width="500" height="62" rx="8" fill="#eeeeee" stroke="#777"/>
  <text x="290" y="462" text-anchor="middle" font-size="16" fill="#333">boards/qemu_riscv64</text>
  <text x="290" y="485" text-anchor="middle" font-size="14" fill="#333">四阶段初始化 + PLIC</text>
  <rect x="620" y="436" width="500" height="62" rx="8" fill="#dde9fb" stroke="#2f5fa8"/>
  <text x="870" y="462" text-anchor="middle" font-size="16" fill="#173a6e">boards/kmiri（新文件，62 行）</text>
  <text x="870" y="485" text-anchor="middle" font-size="14" fill="#173a6e">同样四阶段、同一套驱动，去掉 PLIC</text>

  <!-- row 6 machine -->
  <rect x="40" y="510" width="500" height="88" rx="8" fill="#f2e6f7" stroke="#7b3f99"/>
  <text x="290" y="536" text-anchor="middle" font-size="16" fill="#4a1f5e">QEMU 机器</text>
  <text x="290" y="560" text-anchor="middle" font-size="14" fill="#4a1f5e">32 个 hart · M 模式 · 无 MMU · DRAM 128 MiB</text>
  <text x="290" y="582" text-anchor="middle" font-size="14" fill="#4a1f5e">CLINT · PLIC · NS16550 串口</text>
  <rect x="620" y="510" width="500" height="88" rx="8" fill="#f2e6f7" stroke="#7b3f99"/>
  <text x="870" y="536" text-anchor="middle" font-size="16" fill="#4a1f5e">KMiri 解释器 + 机器描述 kmiri.toml</text>
  <text x="870" y="560" text-anchor="middle" font-size="14" fill="#4a1f5e">2 个虚拟 CPU（可配）· 无页表 · DRAM 声明为 [[pool]]</text>
  <text x="870" y="582" text-anchor="middle" font-size="14" fill="#4a1f5e">CLINT 模型 · UART16550 模型 · 无 PLIC</text>

  <!-- arrows between columns for replaced rows -->
  <g stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="545" y1="380" x2="614" y2="380"/>
    <line x1="545" y1="467" x2="614" y2="467"/>
    <line x1="545" y1="554" x2="614" y2="554"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fa8"/></marker></defs>
  <text x="580" y="372" text-anchor="middle" font-size="13" fill="#2f5fa8">替换</text>
  <text x="580" y="459" text-anchor="middle" font-size="13" fill="#2f5fa8">替换</text>
  <text x="580" y="546" text-anchor="middle" font-size="13" fill="#2f5fa8">模拟</text>

  <!-- legend -->
  <g font-size="14">
    <rect x="60" y="612" width="18" height="14" fill="#e3f4e1" stroke="#3a8a3a"/><text x="84" y="624" fill="#333">原样执行的上游代码</text>
    <rect x="260" y="612" width="18" height="14" fill="#dde9fb" stroke="#2f5fa8"/><text x="284" y="624" fill="#333">新增文件，只在 kmiri 板子上编译</text>
    <rect x="530" y="612" width="18" height="14" fill="#fff4cc" stroke="#b08800"/><text x="554" y="624" fill="#333">记账钩子（内核里唯一的 cfg(miri)）</text>
    <rect x="830" y="612" width="18" height="14" fill="#f2e6f7" stroke="#7b3f99"/><text x="854" y="624" fill="#333">机器：QEMU / KMiri</text>
  </g>
</svg>
